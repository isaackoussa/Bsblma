<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Braids Style by LMA</title>
<meta name="description" content="Agenda, caisse, stock et galerie de Braids Style by LMA, coiffure à domicile à Abidjan.">
<meta name="theme-color" content="#0f0c13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LMA Gestion">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: app mobile, une colonne, barre d'onglets fixe en bas. Look unique violet / blanc / noir (choix de la cliente). */
:root{
  --bg:#f5f2f9; --surface:#ffffff; --surface-2:#efe9f7; --line:#e2daee;
  --fg:#15111a; --muted:#6d6379; --accent:#6c3fc2; --accent-deep:#4b2690; --on-accent:#ffffff;
  --ink:#0f0c13; --ink-2:#1e1826; --ink-line:#2f2739; --ink-fg:#ffffff; --ink-muted:#bcb1ca; --ink-accent:#c4a8f0;
  --good:#1d9466; --warn:#b4761a; --bad:#c23d58;
  --display:"Syne", "Avenir Next", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}

/* En-tête */
.top{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:14px;background:var(--ink);color:var(--ink-fg);border-radius:20px;background-image:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--accent) 45%,transparent),transparent 60%)}
.top .brand h1 em{color:var(--ink-accent)}
.top .brand p{color:var(--ink-muted)}
.top .icon-btn{background:var(--ink-2);border-color:var(--ink-line);color:var(--ink-fg)}
.avatar{position:relative;width:62px;height:62px;flex:none;border-radius:50%;padding:3px;background:linear-gradient(145deg,var(--accent),var(--accent-deep));cursor:pointer}
.avatar-in{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;border:2px solid var(--ink)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-mono{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em;color:var(--accent)}
.avatar-edit{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--bg)}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.note{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:12px;padding:9px 12px;font-size:12.5px;color:var(--muted);margin-bottom:18px}
.note button{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;white-space:nowrap}

/* Typo & blocs */
h2{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
h2:first-child{margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.num{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}

/* Chiffres clés */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi b{display:block;font-family:var(--display);font-size:21px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--ink) 45%,var(--accent-deep));border-color:transparent;color:var(--ink-fg)}
.kpi.hero span{color:var(--ink-muted)}
.kpi.hero b{font-size:30px;color:var(--ink-fg)}
.kpi.hero small{display:block;color:var(--ink-muted);font-size:12.5px;margin-top:2px}
/* Rappels */
.sitebtn{margin-left:auto;position:relative;flex:none}
.sitebtn+.cloud{margin-left:0}
.sitebtn .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.site-badge{display:inline-block;margin-top:4px;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#fff;border-radius:999px;padding:2px 7px;width:max-content}
.cloud{margin-left:auto;position:relative;flex:none}
@media (max-width:380px){.top{gap:8px}.top .icon-btn{width:34px;height:34px}}
.cloud+.bell{margin-left:0}
.cloud .dot{position:absolute;right:6px;bottom:7px;width:9px;height:9px;border-radius:50%;background:var(--ink-muted);border:2px solid var(--ink-2)}
.cloud .dot[data-s="ok"]{background:var(--good)}
.cloud .dot[data-s="pending"],.cloud .dot[data-s="syncing"]{background:var(--warn)}
.cloud .dot[data-s="error"]{background:var(--bad)}
.sync-info{grid-column:1/-1;font-size:14px;color:var(--muted);margin:0 0 4px;line-height:1.5}
.sync-info b{color:var(--fg)}
.ph-loading{display:grid;place-items:center;height:100%;color:var(--muted);font-size:12px}
.bell{margin-left:auto;position:relative;flex:none}
.top .icon-btn svg,.bell svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
.remind{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.remind-row{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:14px;align-items:start}
.remind-row>b{color:var(--accent);font-weight:600}
.remind-row div{min-width:0;font-variant-numeric:tabular-nums}
.remind-row span{color:var(--muted)}
.remind-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
.remind-foot .btn{padding:8px 12px;font-size:13.5px}
.c-good{color:var(--good)} .c-bad{color:var(--bad)} .c-warn{color:var(--warn)}

/* Pills */
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}

/* Rendez-vous */
.list{display:flex;flex-direction:column;gap:8px}
.rdv{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.rdv-time{font-family:var(--display);font-weight:700;font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.rdv-time small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted)}
.rdv-body{min-width:0;display:flex;flex-direction:column}
.rdv-body strong{font-weight:600}
.rdv-body span,.rdv-body small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdv-body small{font-size:12px}
.rdv-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.rdv-side b{font-variant-numeric:tabular-nums;font-size:14px}
.rdv.fait{opacity:.6}

/* Calendrier */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h3{margin:0;font-family:var(--display);font-size:20px;font-weight:700;text-transform:capitalize}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.dow{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0 6px;letter-spacing:.06em}
.day{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums;font-size:14px;padding:0}
.day:hover{background:var(--surface-2)}
.day i{font-style:normal;color:var(--accent);font-size:13px;line-height:6px;letter-spacing:-1px;height:6px}
.day.today span{color:var(--accent);font-weight:700}
.day.sel{background:var(--accent);color:var(--on-accent)}
.day.sel span{color:var(--on-accent);font-weight:700}
.day.sel i{color:var(--on-accent)}

/* Caisse */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.tx{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;width:100%}
.tx-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:17px}
.tx-ico.in{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.tx-ico.out{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.tx-body{min-width:0;display:flex;flex-direction:column}
.tx-body strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-body small{color:var(--muted);font-size:12px}
.tx-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tx-side b{font-variant-numeric:tabular-nums}
.date-sep{font-size:12px;color:var(--muted);margin:10px 2px 2px;text-transform:capitalize}

/* Stock */
.st{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.st.low{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.st-name{background:none;border:0;padding:0;text-align:left;min-width:0;display:flex;flex-direction:column}
.st-name strong{font-weight:600}
.st-name small{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;line-height:1}
.qty output{min-width:30px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}

/* Boutons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.add{width:100%;margin-top:10px;background:transparent;border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent);border-radius:14px;padding:12px;font-weight:600}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{background:none;border:0;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
/* Galerie */
.hint{color:var(--muted);font-size:13.5px;margin:-4px 0 12px;grid-column:1/-1}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ph{position:relative;border:0;padding:0;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-width:100%;background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(15,12,19,.85));color:#fff;font-size:12.5px;font-weight:600;text-align:left;display:flex;flex-direction:column}
.ph small{font-weight:400;opacity:.8}
.thumbs{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto}
.thumbs img{width:84px;height:110px;object-fit:cover;border-radius:10px;flex:none}
.photo-big{grid-column:1/-1;width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:var(--surface-2)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* Feuille (formulaire) */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(15,12,19,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{margin:0 0 14px;font-family:var(--display);font-size:20px;font-weight:700}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.field.half{grid-column:auto}
.field span{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sheet-actions .btn{flex:1 1 auto}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <label class="avatar" for="avatarInput" title="Changer la photo de profil">
      <span class="avatar-in"><img id="avatarImg" src="/assets/logo-lma.png" alt="Logo Braids Style by LMA"></span>
      <span class="avatar-edit" aria-hidden="true">+</span>
    </label>
    <input type="file" id="avatarInput" accept="image/*" hidden>
    <div class="brand">
      <h1>Braids Style <em>by LMA</em></h1>
      <p>Tresses, locks &amp; coiffures protectrices · à domicile, Abidjan</p>
    </div>
    <button type="button" class="icon-btn sitebtn" id="siteBtn" aria-label="Mon site"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg><span class="badge" id="reqBadge" hidden></span></button>
    <button type="button" class="icon-btn cloud" id="cloudBtn" aria-label="Sauvegarde en ligne"><svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 9.6 4.2 4.2 0 0 0 7 18z"/></svg><span class="dot" id="cloudDot" data-s="off"></span></button>
    <button type="button" class="icon-btn bell" id="bellBtn" aria-label="Rappels"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="badge" id="bellBadge" hidden></span></button>
  </header>
  <div class="note" id="demoNote"><span>Prototype rempli avec des données d'exemple.</span><button type="button" id="resetBtn">Tout vider</button></div>

  <main>
    <section class="view" id="v-accueil"></section>
    <section class="view" id="v-agenda" hidden>
      <div class="cal-head">
        <button class="icon-btn" type="button" id="prevM" aria-label="Mois précédent">‹</button>
        <h3 id="calTitle"></h3>
        <button class="icon-btn" type="button" id="nextM" aria-label="Mois suivant">›</button>
      </div>
      <div class="cal" id="cal"></div>
      <h2 id="dayTitle"></h2>
      <div class="list" id="dayList"></div>
      <button class="add" type="button" id="addRdv">+ Nouveau rendez-vous</button>
    </section>
    <section class="view" id="v-caisse" hidden></section>
    <section class="view" id="v-stock" hidden></section>
    <section class="view" id="v-galerie" hidden></section>
    <input type="file" id="photoInput" accept="image/*" multiple hidden>
  </main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" type="button" data-tab="accueil" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Accueil</button>
    <button class="tab" type="button" data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
    <button class="tab" type="button" data-tab="caisse"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16" cy="14.5" r="1.3"/></svg>Caisse</button>
    <button class="tab" type="button" data-tab="stock"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>Stock</button>
    <button class="tab" type="button" data-tab="galerie"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Galerie</button>
  </div>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <form class="sheet" id="sheetForm" novalidate>
    <h3 id="sheetTitle"></h3>
    <div class="fields" id="sheetFields"></div>
    <div class="sheet-actions" id="sheetActions">
      <span id="sheetExtra" style="display:contents"></span>
      <button type="button" class="btn ghost" id="sheetCancel">Annuler</button>
      <button type="submit" class="btn primary" id="sheetSubmit">Enregistrer</button>
    </div>
  </form>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);

let db; try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}

if(!db.photos) db.photos=[];

function ensureDb(){if(!db.photos)db.photos=[];if(!Array.isArray(db.siteStyles))db.siteStyles=SITE_DEFAULTS.map(([n,p])=>({n,p}));if(!Array.isArray(db.requests))db.requests=[]}

let reqToDelete=[];

/* Sauvegarde en ligne */
let code=null;try{code=localStorage.getItem(KEY+'-code')}catch(e){}
let lastSync=null;try{lastSync=+localStorage.getItem(KEY+'-lastsync')||null}catch(e){}
const sync={state:'off',timer:null,busy:false,dirty:false};
const enc=c=>encodeURIComponent(String(c).trim());
async function api(path,opt={}){
  const k=opt.code||code;const headers={...(opt.headers||{})};if(k)headers['x-lma-code']=k;
  const r=await fetch('/api'+path,{method:opt.method||'GET',body:opt.body,headers,cache:'no-store'});
  let b=null;try{b=await r.json()}catch(e){}
  if(!r.ok){const err=new Error((b&&b.error)||('http_'+r.status));err.status=r.status;throw err}
  return b;
}
function setSync(st){sync.state=st;const d=document.getElementById('cloudDot');if(d)d.dataset.s=st}
function schedulePush(){if(!code)return;sync.dirty=true;setSync('pending');clearTimeout(sync.timer);sync.timer=setTimeout(push,1500)}
async function push(){
  if(!code||sync.busy)return;sync.busy=true;sync.dirty=false;setSync('syncing');
  try{
    for(const id of [...(db.deletedPhotos||[])]){await api('/photo/'+id,{method:'DELETE'});db.deletedPhotos=db.deletedPhotos.filter(x=>x!==id)}
    for(const p of db.photos){if(!p.synced&&p.src){await api('/photo/'+p.id,{method:'PUT',body:p.src,headers:{'content-type':'text/plain'}});p.synced=true}}
    const copy={...db,deletedPhotos:[],photos:db.photos.map(({src,synced,...rest})=>rest)};
    await api('/data',{method:'PUT',body:JSON.stringify(copy),headers:{'content-type':'application/json'}});
    lastSync=Date.now();try{localStorage.setItem(KEY+'-lastsync',String(lastSync))}catch(e){}
    saveLocal();setSync(sync.dirty?'pending':'ok');
    for(const id of reqToDelete.splice(0)){try{await api('/requests/'+id,{method:'DELETE'})}catch(e){}}
  }catch(e){sync.dirty=true;setSync(e.status===401?'error':'pending');if(e.status===401)toast('Code de sauvegarde refusé')}
  finally{sync.busy=false;if(sync.dirty&&sync.state!=='error'&&navigator.onLine!==false){clearTimeout(sync.timer);sync.timer=setTimeout(push,4000)}}
}
async function pull(){
  if(!code||sync.busy)return;setSync('syncing');
  try{
    const {data}=await api('/data');
    if(data&&(data.updatedAt||0)>(db.updatedAt||0)){
      const local=new Map(db.photos.map(p=>[p.id,p.src]));
      data.photos=(data.photos||[]).map(p=>({...p,src:local.get(p.id)||null,synced:true}));
      data.deletedPhotos=[];db=data;saveLocal();render();setSync('ok');
      lastSync=Date.now();try{localStorage.setItem(KEY+'-lastsync',String(lastSync))}catch(e){}
      loadMissingPhotos();
    }else if(!data||(db.updatedAt||0)>(data.updatedAt||0)){sync.dirty=true;await push()}
    else setSync('ok');
  }catch(e){setSync(e.status===401?'error':'pending')}
}
let loadingPhotos=false;
async function loadMissingPhotos(){
  if(loadingPhotos||!code)return;loadingPhotos=true;
  try{for(const p of db.photos.filter(x=>!x.src)){try{const r=await api('/photo/'+p.id);p.src=r.src;saveLocal();if(state.tab==='galerie')renderGalerie()}catch(e){if(e.status!==404)break}}}
  finally{loadingPhotos=false}
}
async function openCloud(){
  if(code){
    const when=lastSync?new Date(lastSync).toLocaleString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'jamais';
    const label={ok:'Tout est sauvegardé',pending:'Modifications en attente d’envoi',syncing:'Sauvegarde en cours…',error:'Code refusé : déconnecte puis reconnecte ce téléphone'}[sync.state]||'';
    openSheet({title:'Sauvegarde en ligne',submit:'Sauvegarder maintenant',fields:[],
      html:`<p class="sync-info"><b>${label}</b><br>Dernière sauvegarde : ${when}.<br>Rendez-vous, caisse, stock et photos sont copiés en ligne automatiquement. Sur un autre téléphone, ouvre l’app et connecte-toi avec ton code.</p>`,
      onSubmit:()=>{sync.dirty=true;push();toast('Sauvegarde lancée');return 'nosave'},
      extra:[{label:'Déconnecter ce téléphone',cls:'danger',confirm:true,nosave:true,run:()=>{code=null;try{localStorage.removeItem(KEY+'-code')}catch(e){}setSync('off');toast('Téléphone déconnecté')}}]});
    return;
  }
  let st;try{st=await api('/status')}catch(e){toast('Pas de connexion internet');return}
  if(!st.setup){
    openSheet({title:'Activer la sauvegarde',submit:'Activer',
      html:'<p class="sync-info">Choisis un code secret (6 caractères minimum). Il protège tes données et te permet de les retrouver sur un autre téléphone. <b>Note-le bien : il ne peut pas être récupéré.</b></p>',
      fields:[{k:'c1',label:'Code secret',type:'password'},{k:'c2',label:'Confirme le code',type:'password'}],
      onSubmit:o=>{if(o.c1.length<6){toast('6 caractères minimum');return false}if(o.c1!==o.c2){toast('Les deux codes sont différents');return false}setupCode(o.c1);return 'nosave'}});
  }else{
    openSheet({title:'Connecter ce téléphone',submit:'Connecter',
      html:'<p class="sync-info">La sauvegarde est déjà activée. Entre ton code secret pour retrouver tes données ici. <b>Elles remplaceront celles de ce téléphone.</b></p>',
      fields:[{k:'c1',label:'Code secret',type:'password'}],
      onSubmit:o=>{if(!o.c1){toast('Entre ton code');return false}connectCode(o.c1);return 'nosave'}});
  }
}
async function setupCode(c){
  const v=enc(c);
  try{await api('/setup',{method:'POST',code:'',body:JSON.stringify({code:v}),headers:{'content-type':'application/json'}});
    code=v;try{localStorage.setItem(KEY+'-code',v)}catch(e){}
    db.updatedAt=Date.now();saveLocal();sync.dirty=true;await push();toast('Sauvegarde activée')}
  catch(e){toast(e.message==='already_setup'?'Déjà activée : connecte-toi avec ton code':'Activation impossible, réessaie')}
}
async function connectCode(c){
  const v=enc(c);
  try{await api('/login',{code:v})}catch(e){toast(e.status===401?'Code incorrect':'Connexion impossible, réessaie');return}
  code=v;try{localStorage.setItem(KEY+'-code',v)}catch(e){}
  db.updatedAt=0;await pull();toast('Téléphone connecté');
}

/* Calculs */
const monthKey=T.slice(0,7);
function stats(){
  const m=db.tx.filter(t=>t.date.slice(0,7)===monthKey);
  const encaisse=m.filter(t=>t.type==='entree').reduce((s,t)=>s+(+t.paye||0),0);
  const depenses=m.filter(t=>t.type==='sortie').reduce((s,t)=>s+(+t.paye||0),0);
  const reste=db.tx.filter(t=>t.type==='entree').reduce((s,t)=>s+Math.max(0,t.montant-t.paye),0);
  const dettes=db.tx.filter(t=>t.type==='sortie').reduce((s,t)=>s+Math.max(0,t.montant-t.paye),0);
  return{encaisse,depenses,solde:encaisse-depenses,reste,dettes};
}
const lowStock=()=>db.stock.filter(s=>s.qte<=s.seuil);

/* Rendus */
function rdvCard(r,showDate){
  const reste=Math.max(0,r.prix-r.acompte);
  let pill=r.statut==='fait'?'<span class="pill good">Terminé</span>':r.acompte>=r.prix&&r.prix>0?'<span class="pill good">Payé</span>':r.acompte>0?`<span class="pill acc">Reste ${fmt(reste)}</span>`:'<span class="pill warn">Sans acompte</span>';
  return `<button type="button" class="rdv ${r.statut}" data-rdv="${r.id}">
    <div class="rdv-time">${esc(r.heure)}${showDate?`<small>${dShort(r.date)}</small>`:''}</div>
    <div class="rdv-body"><strong>${esc(r.cliente)}</strong><span>${esc(r.prestation)}</span><small>${esc(r.quartier)}${r.tel?' · '+esc(r.tel):''}</small></div>
    <div class="rdv-side"><b>${fmt(r.prix)}</b>${pill}</div></button>`;
}
function txRow(t){
  const reste=Math.max(0,t.montant-t.paye), inn=t.type==='entree';
  const pill=reste<=0?'<span class="pill good">Soldé</span>':`<span class="pill ${inn?'warn':'bad'}">${inn?'Reste':'Dû'} ${fmt(reste)}</span>`;
  return `<button type="button" class="tx" data-tx="${t.id}">
    <span class="tx-ico ${inn?'in':'out'}">${inn?'+':'−'}</span>
    <span class="tx-body"><strong>${esc(t.libelle)}</strong><small>${esc(t.cat)}</small></span>
    <span class="tx-side"><b class="${inn?'c-good':''}">${inn?'+':'−'}${fmt(t.montant)}</b>${pill}</span></button>`;
}
const byDateTime=(a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure);

      r.status='acceptée';const d=parseD(o.date);state.sel=o.date;state.month=new Date(d.getFullYear(),d.getMonth(),1);toast('Ajouté à l’agenda')},
    extra:[{label:'Écrire sur WhatsApp',nosave:true,run:()=>{window.open('https://wa.me/'+waNum(r.phone),'_blank')}},

async function fetchRequests(){
  if(!code)return;
  try{const {requests}=await api('/requests');if(!requests||!requests.length)return;ensureDb();
    let added=0;for(const r of requests){if(!db.requests.some(x=>x.id===r.id)){db.requests.unshift({...r,status:'nouvelle'});added++}reqToDelete.push(r.id)}
    db.requests=db.requests.slice(0,200);save();render();
    if(added){notify('Nouvelle demande de rendez-vous',`${requests[0].name} · ${requests[0].style}`,'req');toast(added>1?added+' nouvelles demandes du site':'Nouvelle demande du site')}
  }catch(e){}
}
function openSite(){
  if(!code){openSheet({title:'Mon site',submit:'Activer la sauvegarde',fields:[],html:'<p class="sync-info" style="grid-column:1/-1">Pour changer les prix du site, publier des photos et recevoir les demandes de rendez-vous, active d’abord la sauvegarde en ligne.</p>',onSubmit:()=>{setTimeout(openCloud,0);return 'nosave'}});return}
  const nr=db.requests.filter(r=>r.status==='nouvelle').length;

    fields:db.siteStyles.map((x,i)=>({k:'p'+i,label:x.n,type:'number',value:x.p,half:true})),
    onSubmit:o=>{db.siteStyles.forEach((x,i)=>{x.p=o['p'+i]});toast('Prix publiés sur le site')}});
}

    </div>
    <h2>Aujourd'hui · ${dLong(T)}</h2>
    <div class="list">${today.length?today.map(r=>rdvCard(r)).join(''):'<p class="empty">Aucun rendez-vous aujourd\'hui.</p>'}</div>
    <h2>À venir</h2>
    <div class="list">${next.length?next.map(r=>rdvCard(r,true)).join(''):'<p class="empty">Rien de prévu pour l\'instant.</p>'}</div>
    <h2>Stock à racheter</h2>
    <div class="list">${low.length?low.map(stRow).join(''):'<p class="empty">Le stock est bon.</p>'}</div>`;
}

/* Rappels & notifications */
function upcoming(){const tm=shift(1);const pend=d=>db.rdv.filter(r=>r.date===d&&r.statut!=='fait').sort(byDateTime);return{today:pend(T),tomorrow:pend(tm)}}
const hasNotif=()=>'Notification' in window;
const notifState=()=>hasNotif()?Notification.permission:'absent';
function remindHTML(){
  const u=upcoming();
  const line=r=>`${esc(r.heure)} · ${esc(r.cliente)} <span>· ${esc(r.prestation)}, ${esc(r.quartier)}</span>`;
  const block=(label,arr)=>`<div class="remind-row"><b>${label}</b><div>${arr.length?arr.map(line).join('<br>'):'<span>Aucun rendez-vous</span>'}</div></div>`;
  const st=notifState();
  const foot=st==='granted'?'<span class="pill good">Notifications activées</span><span>Résumé chaque matin + alerte 1 h avant</span>'
    :st==='denied'?'<span>Notifications bloquées : autorise-les dans les réglages du navigateur.</span>'
    :st==='absent'?'<span>Ce navigateur ne gère pas les notifications. Sur iPhone : Partager → « Sur l’écran d’accueil », puis ouvre l’app depuis l’icône.</span>'
    :'<span>Reçois un résumé le matin et une alerte 1 h avant chaque RDV.</span><button type="button" class="btn primary" id="notifBtn">Activer</button>';
  return `<div class="remind">${block("Aujourd'hui",u.today)}${block('Demain',u.tomorrow)}<div class="remind-foot">${foot}</div></div>`;
}
function notify(title,body,tag){const opt={body,icon:'/assets/icon-192.png',badge:'/assets/icon-192.png',tag};
  if('serviceWorker' in navigator&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(r=>r.showNotification(title,opt)).catch(()=>{try{new Notification(title,opt)}catch(e){}})}
  else{try{new Notification(title,opt)}catch(e){}}}
function sendDigest(force){
  if(notifState()!=='granted')return;let last=null;try{last=localStorage.getItem(KEY+'-digest')}catch(e){}
  if(!force&&last===T)return;const u=upcoming();
  notify('Braids Style by LMA',`Aujourd'hui : ${u.today.length} RDV${u.today[0]?' (1er à '+u.today[0].heure+')':''} · Demain : ${u.tomorrow.length} RDV`,'digest');
  try{localStorage.setItem(KEY+'-digest',T)}catch(e){}
}
let timers=[];
function scheduleToday(){
  timers.forEach(clearTimeout);timers=[];if(notifState()!=='granted')return;
  upcoming().today.forEach(r=>{const[h,m]=r.heure.split(':').map(Number);const wait=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m).getTime()-36e5-Date.now();
    if(wait>0)timers.push(setTimeout(()=>notify('RDV dans 1 heure',`${r.heure} · ${r.cliente} : ${r.prestation} (${r.quartier})`,'rdv-'+r.id),wait))});
}
async function enableNotif(){
  if(!hasNotif()){toast('Notifications indisponibles ici');return}
  try{const p=await Notification.requestPermission();if(p==='granted'){sendDigest(true);scheduleToday();toast('Rappels activés')}else toast('Notifications non autorisées')}catch(e){toast('Notifications indisponibles ici')}
  render();
}
function clientMsg(r){const tm=shift(1);const quand=r.date===T?"aujourd'hui":r.date===tm?'demain':'le '+dLong(r.date);
  return `Bonjour ${r.cliente}, petit rappel de votre rendez-vous ${quand} à ${r.heure.replace(':','h')} pour vos ${r.prestation} (${r.quartier}). À très vite ! Braids Style by LMA`}

function renderAgenda(){
  const m=state.month,y=m.getFullYear(),mo=m.getMonth();
  $('#calTitle').textContent=m.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const start=(new Date(y,mo,1).getDay()+6)%7, days=new Date(y,mo+1,0).getDate();
  let h=['L','M','M','J','V','S','D'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<start;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){const k=`${y}-${pad(mo+1)}-${pad(d)}`;const n=db.rdv.filter(r=>r.date===k).length;
    h+=`<button type="button" class="day${k===T?' today':''}${k===state.sel?' sel':''}" data-day="${k}" aria-label="${dLong(k)}${n?', '+n+' rendez-vous':''}"><span>${d}</span><i>${'•'.repeat(Math.min(n,3))}</i></button>`}
  $('#cal').innerHTML=h;
  const list=db.rdv.filter(r=>r.date===state.sel).sort(byDateTime);
  $('#dayTitle').textContent=(state.sel===T?"Aujourd'hui · ":'')+dLong(state.sel);
  $('#dayList').innerHTML=list.length?list.map(r=>rdvCard(r)).join(''):'<p class="empty">Journée libre.</p>';
}

function renderCaisse(){
  const s=stats(), f=state.filter;
  let tx=[...db.tx].sort((a,b)=>b.date.localeCompare(a.date));
  if(f==='entree'||f==='sortie')tx=tx.filter(t=>t.type===f);
  if(f==='nonsolde')tx=tx.filter(t=>t.montant-t.paye>0);
  let rows='',last='';
  tx.forEach(t=>{if(t.date!==last){rows+=`<div class="date-sep">${t.date===T?"Aujourd'hui":dLong(t.date)}</div>`;last=t.date}rows+=txRow(t)});
  const chip=(k,l)=>`<button type="button" class="chip" data-filter="${k}" aria-pressed="${f===k}">${l}</button>`;
  $('#v-caisse').innerHTML=`
    <div class="kpis">
      <div class="kpi hero"><span>Solde du mois</span><b>${fmt(s.solde)}</b><small>Argent réellement encaissé moins dépenses payées</small></div>
      <div class="kpi"><span>Entrées</span><b class="c-good">${fmt(s.encaisse)}</b></div>
      <div class="kpi"><span>Sorties</span><b class="c-bad">${fmt(s.depenses)}</b></div>
      <div class="kpi"><span>Clientes me doivent</span><b class="c-warn">${fmt(s.reste)}</b></div>
      <div class="kpi"><span>Je dois</span><b>${fmt(s.dettes)}</b></div>
    </div>
    <h2>Mouvements</h2>
    <div class="chips">${chip('tout','Tout')}${chip('entree','Entrées')}${chip('sortie','Sorties')}${chip('nonsolde','Non soldés')}</div>
    <div class="list">${rows||'<p class="empty">Aucun mouvement ici.</p>'}</div>
    <div class="row" style="gap:8px"><button class="add" type="button" data-new="entree">+ Entrée</button><button class="add" type="button" data-new="sortie">− Sortie</button></div>`;
}

function stRow(s){const low=s.qte<=s.seuil;
  return `<div class="st${low?' low':''}">
    <button type="button" class="st-name" data-st="${s.id}"><strong>${esc(s.nom)}</strong><small>${low?'<span class="c-warn">À racheter</span> · ':''}alerte à ${s.seuil} ${esc(s.unite)} · ${fmt(s.prix)}/u</small></button>
    <div class="qty"><button type="button" data-dec="${s.id}" aria-label="Retirer un ${esc(s.nom)}">−</button><output>${s.qte}</output><button type="button" data-inc="${s.id}" aria-label="Ajouter un ${esc(s.nom)}">+</button></div></div>`}
function renderStock(){
  const val=db.stock.reduce((a,s)=>a+s.qte*s.prix,0), low=lowStock().length;
  $('#v-stock').innerHTML=`
    <div class="kpis">
      <div class="kpi"><span>Valeur du stock</span><b>${fmt(val)}</b></div>
      <div class="kpi"><span>À racheter</span><b class="${low?'c-warn':'c-good'}">${low} produit${low>1?'s':''}</b></div>
    </div>
    <h2>Produits</h2>
    <div class="list">${db.stock.length?db.stock.map(stRow).join(''):'<p class="empty">Ajoute tes mèches et produits.</p>'}</div>
    <button class="add" type="button" id="addSt">+ Nouveau produit</button>`;
}

/* Galerie (facultatif) */
function renderGalerie(){
  const ph=[...db.photos].sort((a,b)=>b.date.localeCompare(a.date)),f=state.gal;
  const cats=[...new Set(ph.map(p=>p.prestation))];
  const list=f==='tout'?ph:ph.filter(p=>p.prestation===f);
  const chip=(k,l)=>`<button type="button" class="chip" data-gal="${esc(k)}" aria-pressed="${f===k}">${esc(l)}</button>`;
  $('#v-galerie').innerHTML=`
    <h2>Mes réalisations</h2>
    <p class="hint">Facultatif : garde les photos de tes coiffures pour les montrer aux clientes.</p>
    ${ph.length?`<div class="chips">${chip('tout','Tout')}${cats.map(c=>chip(c,c)).join('')}</div>
    <div class="gal">${list.map(p=>`<button type="button" class="ph" data-ph="${p.id}">${p.src?`<img src="${p.src}" alt="${esc(p.prestation)}" loading="lazy">`:'<span class="ph-loading">Chargement…</span>'}<span>${esc(p.prestation)}<small>${dShort(p.date)}${p.cliente?' · '+esc(p.cliente):''}</small>${p.site?'<em class="site-badge">Sur le site</em>':''}</span></button>`).join('')}</div>`
    :'<p class="empty">Aucune photo pour l\'instant. Tu peux en ajouter ici ou depuis un rendez-vous.</p>'}
    <button class="add" type="button" id="addPhoto">+ Ajouter des photos</button>`;
}
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(file)})}
let photoCtx={};
function pickPhotos(ctx){photoCtx=ctx||{};const i=$('#photoInput');i.value='';i.click()}
$('#photoInput').addEventListener('change',async e=>{
  const files=[...e.target.files];if(!files.length)return;const srcs=[];
  try{for(const f of files)srcs.push(await compress(f))}catch(err){toast('Cette image ne peut pas être lue');return}
  const c=photoCtx;
  openSheet({title:srcs.length>1?srcs.length+' photos':'Nouvelle photo',submit:'Ajouter à la galerie',
    html:`<div class="thumbs">${srcs.map(s=>`<img src="${s}" alt="">`).join('')}</div>`,
    fields:[{k:'prestation',label:'Coiffure',type:'select',options:PRESTATIONS,value:c.prestation||PRESTATIONS[0]},
      {k:'cliente',label:'Cliente (facultatif)',value:c.cliente||''},
      {k:'date',label:'Date',type:'date',value:c.date||T}],
    onSubmit:o=>{srcs.forEach(s=>db.photos.push({id:uid(),src:s,rdvId:c.rdvId||null,...o}));
      if(!save()){db.photos.splice(-srcs.length);toast('Mémoire pleine : supprime quelques photos');return false}
      toast(srcs.length>1?'Photos ajoutées':'Photo ajoutée')}});
});
function photoView(p){
  openSheet({title:p.prestation,submit:'Fermer',onSubmit:()=>'nosave',fields:[],
    html:`${p.src?`<img class="photo-big" src="${p.src}" alt="${esc(p.prestation)}">`:'<p class="empty" style="grid-column:1/-1">Photo en cours de chargement…</p>'}<p class="hint" style="margin:4px 0 0">${p.cliente?esc(p.cliente)+' · ':''}${dLong(p.date)}</p>`,
    extra:[{label:p.site?'Retirer du site':'Montrer sur le site',cls:'good',run:()=>{if(!code){toast('Active d’abord la sauvegarde en ligne');return}p.site=!p.site;toast(p.site?'Photo visible sur le site':'Photo retirée du site')}},
      {label:'Supprimer',cls:'danger',confirm:true,run:()=>{if(p.synced)(db.deletedPhotos=db.deletedPhotos||[]).push(p.id);db.photos=db.photos.filter(x=>x.id!==p.id);toast('Photo supprimée')}}]});
}

function render(){
  ensureDb();
  ({accueil:renderAccueil,agenda:renderAgenda,caisse:renderCaisse,stock:renderStock,galerie:renderGalerie})[state.tab]();
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+state.tab);
  document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab===state.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#demoNote').hidden=!db.demo;
  const u=upcoming(),n=u.today.length+u.tomorrow.length,bd=$('#bellBadge');bd.textContent=n;bd.hidden=!n;
  const nr=db.requests.filter(r=>r.status==='nouvelle').length,rb=$('#reqBadge');rb.textContent=nr;rb.hidden=!nr;
  scheduleToday();
}

/* Feuille formulaire */
let sheetCb=null,sheetExtra=[];
function openSheet({title,fields,submit='Enregistrer',onSubmit,extra=[],html=''}){
  $('#sheetTitle').textContent=title;
  $('#sheetFields').innerHTML=html+fields.map(f=>{const id='f_'+f.k;let input;
    if(f.type==='select')input=`<select id="${id}" name="${f.k}">${f.options.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}"${v==f.value?' selected':''}>${esc(l)}</option>`}).join('')}</select>`;
    else input=`<input id="${id}" name="${f.k}" type="${f.type||'text'}" value="${esc(f.value??'')}"${f.type==='number'?' min="0" step="1" inputmode="numeric"':''}${f.ph?` placeholder="${esc(f.ph)}"`:''}>`;
    return `<label class="field${f.half?' half':''}" for="${id}"><span>${esc(f.label)}</span>${input}</label>`}).join('');
  $('#sheetSubmit').textContent=submit;
  $('#sheetExtra').innerHTML=extra.map((e,i)=>`<button type="button" class="btn ${e.cls||'ghost'}" data-x="${i}">${esc(e.label)}</button>`).join('');
  sheetCb=onSubmit;sheetExtra=extra;sheetFieldsDef=fields;$('#sheet').hidden=false;
  const first=$('#sheetFields input');if(first&&!first.value)first.focus();
}
let sheetFieldsDef=[];
const closeSheet=()=>{$('#sheet').hidden=true};
function readForm(){const o={};sheetFieldsDef.forEach(f=>{const v=$('#f_'+f.k).value.trim();o[f.k]=f.type==='number'?Math.max(0,Number(v)||0):v});return o}
$('#sheetForm').addEventListener('submit',e=>{e.preventDefault();const o=readForm();const r=sheetCb?sheetCb(o):undefined;if(r===false)return;if(r!=='nosave')save();closeSheet();render()});
$('#sheetCancel').addEventListener('click',closeSheet);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#sheetExtra').addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=sheetExtra[+b.dataset.x];
  if(x.confirm&&!b.dataset.armed){b.dataset.armed='1';b.textContent='Confirmer la suppression';return}
  x.run(readForm());if(!x.nosave)save();closeSheet();render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
const need=(o,k,msg)=>{if(!o[k]){toast(msg);return false}return true};

/* Rendez-vous */
function rdvForm(r){
  const isNew=!r; r=r||{date:state.sel,heure:'09:00',cliente:'',tel:'',prestation:PRESTATIONS[0],quartier:'',prix:'',acompte:'',statut:'prevu'};
  const extra=[];
  if(!isNew){const n=db.photos.filter(p=>p.rdvId===r.id).length;extra.push({label:n?`Ajouter une photo (${n})`:'Ajouter une photo',run:o=>{Object.assign(r,o);pickPhotos({rdvId:r.id,prestation:r.prestation,cliente:r.cliente,date:r.date})}})}
  if(!isNew&&r.statut!=='fait')extra.push({label:'Copier le rappel cliente',run:o=>{const txt=clientMsg({...r,...o});try{navigator.clipboard.writeText(txt).then(()=>toast('Message copié, colle-le sur WhatsApp'),()=>toast('Copie impossible ici'))}catch(e){toast('Copie impossible ici')}}});
  if(!isNew&&r.statut!=='fait')extra.push({label:'Terminé → encaisser',cls:'good',run:o=>{Object.assign(r,o,{statut:'fait'});setTimeout(()=>txForm(null,{type:'entree',date:T,libelle:`${r.prestation} · ${r.cliente}`,cat:'Prestation',montant:r.prix,paye:r.prix}),0)}});
  if(!isNew)extra.push({label:'Supprimer',cls:'danger',confirm:true,run:()=>{db.rdv=db.rdv.filter(x=>x.id!==r.id);toast('Rendez-vous supprimé')}});
  openSheet({title:isNew?'Nouveau rendez-vous':'Rendez-vous',submit:isNew?'Ajouter':'Enregistrer',extra,fields:[
    {k:'cliente',label:'Cliente',value:r.cliente,ph:'Nom de la cliente'},
    {k:'tel',label:'Téléphone / WhatsApp',type:'tel',value:r.tel,ph:'07 00 00 00 00'},
    {k:'date',label:'Date',type:'date',value:r.date,half:true},
    {k:'heure',label:'Heure',type:'time',value:r.heure,half:true},
    {k:'prestation',label:'Coiffure',type:'select',options:PRESTATIONS,value:r.prestation},
    {k:'quartier',label:'Quartier / adresse',value:r.quartier,ph:'Ex. Cocody Angré'},
    {k:'prix',label:'Prix (FCFA)',type:'number',value:r.prix,half:true},
    {k:'acompte',label:'Acompte reçu',type:'number',value:r.acompte,half:true}],
    onSubmit:o=>{if(!need(o,'cliente','Ajoute le nom de la cliente')||!need(o,'date','Choisis une date'))return false;
      if(isNew){db.rdv.push({id:uid(),statut:'prevu',...o});state.sel=o.date;const d=parseD(o.date);state.month=new Date(d.getFullYear(),d.getMonth(),1);toast('Rendez-vous ajouté')}else{Object.assign(r,o);toast('Enregistré')}}});
}

/* Caisse */
function txForm(t,preset){
  const isNew=!t; t=t||Object.assign({type:'entree',date:T,libelle:'',cat:'Prestation',montant:'',paye:''},preset||{});
  const extra=[];
  if(!isNew&&t.montant-t.paye>0)extra.push({label:'Marquer soldé',cls:'good',run:o=>{Object.assign(t,o);t.paye=t.montant;toast('Soldé')}});
  if(!isNew)extra.push({label:'Supprimer',cls:'danger',confirm:true,run:()=>{db.tx=db.tx.filter(x=>x.id!==t.id);toast('Mouvement supprimé')}});
  openSheet({title:isNew?(t.type==='entree'?'Nouvelle entrée':'Nouvelle sortie'):'Mouvement',submit:isNew?'Ajouter':'Enregistrer',extra,fields:[
    {k:'type',label:'Type',type:'select',options:[['entree','Entrée (argent reçu)'],['sortie','Sortie (dépense)']],value:t.type},
    {k:'libelle',label:'Libellé',value:t.libelle,ph:t.type==='entree'?'Ex. Box braids · Fatou':'Ex. Mèches X-pression ×5'},
    {k:'cat',label:'Catégorie',type:'select',options:[...CAT_IN,...CAT_OUT],value:t.cat},
    {k:'date',label:'Date',type:'date',value:t.date},
    {k:'montant',label:'Montant total',type:'number',value:t.montant,half:true},
    {k:'paye',label:'Déjà payé',type:'number',value:t.paye,half:true}],
    onSubmit:o=>{if(!need(o,'libelle','Ajoute un libellé')||!need(o,'montant','Indique le montant'))return false;
      o.paye=Math.min(o.paye,o.montant);
      if(isNew){db.tx.push({id:uid(),...o});toast(o.type==='entree'?'Entrée ajoutée':'Sortie ajoutée')}else{Object.assign(t,o);toast('Enregistré')}}});
}

/* Stock */
function stForm(s){
  const isNew=!s; s=s||{nom:'',qte:'',unite:'paquets',seuil:'',prix:''};
  const extra=isNew?[]:[{label:'Supprimer',cls:'danger',confirm:true,run:()=>{db.stock=db.stock.filter(x=>x.id!==s.id);toast('Produit supprimé')}}];
  openSheet({title:isNew?'Nouveau produit':s.nom,submit:isNew?'Ajouter':'Enregistrer',extra,fields:[
    {k:'nom',label:'Produit',value:s.nom,ph:'Ex. Mèches X-pression'},
    {k:'qte',label:'Quantité',type:'number',value:s.qte,half:true},
    {k:'unite',label:'Unité',value:s.unite,half:true},
    {k:'seuil',label:'Alerte quand il reste',type:'number',value:s.seuil,half:true},
    {k:'prix',label:'Prix d\'achat / unité',type:'number',value:s.prix,half:true}],
    onSubmit:o=>{if(!need(o,'nom','Donne un nom au produit'))return false;
      if(isNew){db.stock.push({id:uid(),...o});toast('Produit ajouté')}else{Object.assign(s,o);toast('Enregistré')}}});
}

/* Événements */
document.addEventListener('click',e=>{
  const g=(a)=>e.target.closest(`[${a}]`);let b;
  if(b=g('data-tab')){state.tab=b.dataset.tab;render();window.scrollTo(0,0);return}
  if(b=g('data-rdv'))return rdvForm(db.rdv.find(r=>r.id===b.dataset.rdv));
  if(b=g('data-tx'))return txForm(db.tx.find(t=>t.id===b.dataset.tx));
  if(b=g('data-st'))return stForm(db.stock.find(s=>s.id===b.dataset.st));
  if(b=g('data-day')){state.sel=b.dataset.day;renderAgenda();return}
  if(b=g('data-filter')){state.filter=b.dataset.filter;renderCaisse();return}
  if(b=g('data-gal')){state.gal=b.dataset.gal;renderGalerie();return}
  if(b=g('data-ph'))return photoView(db.photos.find(p=>p.id===b.dataset.ph));
  if(e.target.closest('#addPhoto'))return pickPhotos();
  if(b=g('data-new'))return txForm(null,{type:b.dataset.new,cat:b.dataset.new==='entree'?'Prestation':'Achat mèches'});
  if(b=g('data-inc')||g('data-dec')){const id=b.dataset.inc||b.dataset.dec;const s=db.stock.find(x=>x.id===id);s.qte=Math.max(0,s.qte+(b.dataset.inc?1:-1));save();render();return}
  if(e.target.closest('#siteBtn'))return openSite();
  if(b=g('data-req'))return reqForm(db.requests.find(r=>r.id===b.dataset.req));
  if(e.target.closest('#cloudBtn'))return openCloud();
  if(e.target.closest('#bellBtn')){state.tab='accueil';render();const h=$('#rappels');if(h)h.scrollIntoView({block:'start'});return}
  if(e.target.closest('#notifBtn'))return enableNotif();
  if(e.target.closest('#addRdv'))return rdvForm();
  if(e.target.closest('#addSt'))return stForm();
  if(e.target.closest('#prevM')){state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);renderAgenda();return}
  if(e.target.closest('#nextM')){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);renderAgenda();return}
  if(e.target.closest('#resetBtn')){const r=$('#resetBtn');if(!r.dataset.armed){r.dataset.armed='1';r.textContent='Confirmer ?';return}
    db={demo:false,rdv:[],tx:[],stock:[],photos:[],deletedPhotos:db.photos.filter(p=>p.synced).map(p=>p.id)};save();r.dataset.armed='';r.textContent='Tout vider';render();toast('Prêt pour tes vraies données')}
});
render();
sendDigest(false);
setSync(code?'pending':'off');if(code){pull().then(()=>{loadMissingPhotos();fetchRequests()})}
setInterval(()=>{if(code&&!document.hidden)fetchRequests()},90000);
window.addEventListener('online',()=>{if(code)pull()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/app/sw.js',{scope:'/app/'}).catch(()=>{}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(iso(new Date())!==T){location.reload();return}sendDigest(false);render();if(code)pull().then(fetchRequests)});
})();
</script>
